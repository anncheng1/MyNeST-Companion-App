<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>Simulation · MyNeST</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --navy:#0a1628;--navy-mid:#122040;--navy-card:#1a2d50;
  --blue:#3b9eff;--blue-bright:#5db0ff;--teal:#00d4b4;--red:#ff4d6a;--amber:#ffb340;--green:#34d399;--purple:#a78bfa;
  --text:#e8f0fe;--text-dim:#8da4c4;--border:#243860;
  --radius:14px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.topbar{display:flex;align-items:center;gap:12px;background:var(--navy-mid);border-bottom:1px solid var(--border);padding:48px 16px 14px;position:sticky;top:0;z-index:100;}
.back-btn{width:36px;height:36px;border-radius:10px;background:var(--navy-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--blue);font-size:18px;flex-shrink:0;}
.topbar-title{font-size:17px;font-weight:700;color:#fff;}
.topbar-sub{font-size:11px;color:var(--text-dim);}
.content{padding:16px;}

/* Case picker */
.case-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.case-btn{
  background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;cursor:pointer;transition:all .15s;
}
.case-btn:active{transform:scale(.97);}
.case-btn.active{border-color:var(--purple);background:rgba(167,139,250,.1);}
.case-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin-bottom:4px;}
.case-name{font-size:13px;font-weight:700;color:#fff;line-height:1.3;}

.case-full{grid-column:1/-1;}

/* Vital signs display */
.vitals-panel{
  background:var(--navy-mid);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;
}
.vitals-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;}
.vitals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.vital{
  background:var(--navy-card);border:1px solid var(--border);border-radius:10px;
  padding:10px 8px;text-align:center;
}
.vital-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:4px;}
.vital-val{font-size:22px;font-weight:900;line-height:1;transition:all .3s;}
.vital-unit{font-size:10px;color:var(--text-dim);margin-top:2px;}

.vital-hr{border-color:rgba(255,77,106,.3);}
.vital-hr .vital-val{color:var(--red);}
.vital-hr.ok .vital-val{color:var(--green);}
.vital-hr.warn .vital-val{color:var(--amber);}
.vital-spo2{border-color:rgba(59,158,255,.3);}
.vital-spo2 .vital-val{color:var(--blue-bright);}
.vital-fio2{border-color:rgba(0,212,180,.3);}
.vital-fio2 .vital-val{color:var(--teal);}
.vital-temp .vital-val{color:var(--amber);}
.vital-rr .vital-val{color:var(--purple);}
.vital-effort .vital-val{color:var(--text);font-size:13px;font-weight:700;}

/* Vital controls */
.vital-controls{
  background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:14px;
}
.vc-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;}
.vc-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.vc-name{font-size:12px;color:var(--text-dim);width:60px;flex-shrink:0;}
.vc-btns{display:flex;gap:4px;flex:1;}
.vc-btn{
  flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--border);
  background:var(--navy-mid);color:var(--text-dim);font-size:11px;font-weight:600;
  cursor:pointer;text-align:center;transition:all .15s;
}
.vc-btn.active{border-color:var(--blue);background:rgba(59,158,255,.15);color:var(--blue-bright);}

/* Scenario card */
.scenario-card{
  background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;
}
.sc-head{
  padding:12px 14px;background:rgba(167,139,250,.1);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;cursor:pointer;
}
.sc-icon{font-size:18px;}
.sc-title{font-size:14px;font-weight:700;color:#fff;flex:1;}
.sc-chev{color:var(--text-dim);font-size:12px;transition:transform .2s;}
.scenario-card.open .sc-chev{transform:rotate(180deg);}
.sc-body{padding:14px;display:none;font-size:13px;line-height:1.7;color:var(--text-dim);}
.scenario-card.open .sc-body{display:block;}
.sc-body strong{color:var(--text);}

/* Debrief questions */
.debrief-card{
  background:var(--navy-mid);border:1px solid rgba(0,212,180,.2);border-radius:var(--radius);
  padding:14px;
}
.debrief-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:10px;}
.q-item{display:flex;gap:8px;margin-bottom:10px;font-size:13px;color:var(--text-dim);line-height:1.6;}
.q-item:last-child{margin-bottom:0;}
.q-num{
  min-width:22px;height:22px;border-radius:50%;background:rgba(0,212,180,.15);border:1px solid rgba(0,212,180,.3);
  font-size:11px;font-weight:700;color:var(--teal);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;
}

.no-case{text-align:center;padding:30px;color:var(--text-dim);font-size:14px;}

.bottom-safe{height:calc(20px + var(--safe-bottom));}

.timer-mini{
  display:flex;align-items:center;gap:8px;
  background:var(--navy-mid);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;margin-bottom:12px;
}
.timer-mini-val{font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;}
.timer-mini-btns{margin-left:auto;display:flex;gap:6px;}
.tmb{padding:6px 12px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer;background:var(--navy-card);color:var(--text);}
.tmb.go{background:var(--green);color:#0a1628;border-color:var(--green);}
.tmb.stop{background:var(--red);color:#fff;border-color:var(--red);}
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="index.html">←</a>
  <div>
    <div class="topbar-title">Simulation Instructor Mode</div>
    <div class="topbar-sub">Facilitator view · Workshops only</div>
  </div>
</div>

<div class="content">

  <!-- Case selector -->
  <div class="case-grid" id="caseGrid"></div>

  <!-- Timer -->
  <div class="timer-mini">
    <span style="font-size:13px;color:var(--text-dim);">⏱ Scenario:</span>
    <span class="timer-mini-val" id="simTimer">00:00</span>
    <div class="timer-mini-btns">
      <div class="tmb go" id="simStartBtn" onclick="simStart()">▶</div>
      <div class="tmb" onclick="simReset()">↺</div>
    </div>
  </div>

  <!-- Vital signs -->
  <div class="vitals-panel">
    <div class="vitals-label">📟 Vital Signs Display</div>
    <div class="vitals-grid">
      <div class="vital vital-hr" id="v-hr"><div class="vital-name">HR</div><div class="vital-val" id="vv-hr">—</div><div class="vital-unit">bpm</div></div>
      <div class="vital vital-spo2" id="v-spo2"><div class="vital-name">SpO₂</div><div class="vital-val" id="vv-spo2">—</div><div class="vital-unit">%</div></div>
      <div class="vital vital-fio2"><div class="vital-name">FiO₂</div><div class="vital-val" id="vv-fio2">—</div><div class="vital-unit">%</div></div>
      <div class="vital vital-rr"><div class="vital-name">RR</div><div class="vital-val" id="vv-rr">—</div><div class="vital-unit">/min</div></div>
      <div class="vital vital-temp"><div class="vital-name">Temp</div><div class="vital-val" id="vv-temp">—</div><div class="vital-unit">°C</div></div>
      <div class="vital vital-effort"><div class="vital-name">Effort</div><div class="vital-val" id="vv-effort">—</div></div>
    </div>
  </div>

  <!-- Vital sign controls -->
  <div class="vital-controls">
    <div class="vc-label">🎛 Facilitator Controls — Advance Vitals on Correct Actions</div>
    <div id="vcRows"><!-- built by JS --></div>
  </div>

  <!-- Scenario content -->
  <div id="scenarioContent">
    <div class="no-case">Select a case above to begin</div>
  </div>

</div>
<div class="bottom-safe"></div>

<script>

      {title:'🎯 Expected Actions',body:'<strong>M</strong> — Mask: reseat, thenar eminence down, lift chin<br><strong>A</strong> — Airway: sniffing position, suction if needed, open mouth<br><strong>S</strong> — Step up PIP by 5 cmH₂O, call new pressure<br><strong>K</strong> — Key alternative: LMA or ETT only if M-A-S fails<br><strong>OG tube</strong> after 2 min PPV'},

let activeCase=null, simTimerInterval=null, simStart0=null, simRunning=false;
let vitalIdx=0;

function buildCaseGrid(){
  const el=document.getElementById('caseGrid');
  let html='';
  const groups=[
    {label:'Teaching Cases',ids:['4a','5a','6a','7a','8a','9a']},
    {label:'Assessment Scenarios',ids:['sca','scb','scc','scd']},
  ];
  groups.forEach(g=>{
    html+=`<div class="case-full" style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);padding:10px 2px 4px;">${g.label}</div>`;
    g.ids.forEach(id=>{
      const c=CASES.find(x=>x.id===id);
      html+=`<div class="case-btn" id="cb-${id}" onclick="selectCase('${id}')">
        <div class="case-tag">${c.tag}</div>
        <div class="case-name">${c.name}</div>
      </div>`;
    });
  });
  el.innerHTML=html;
}

function selectCase(id){
  activeCase=CASES.find(c=>c.id===id);
  vitalIdx=0;
  document.querySelectorAll('.case-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('cb-'+id).classList.add('active');
  simReset();
  renderVitals();
  buildVcRows();
  renderScenario();
}

function renderVitals(){
  if(!activeCase)return;
  const v=activeCase.vitals[vitalIdx];
  setVital('hr',v.hr,'--');
  setVital('spo2',v.spo2,'—');
  setVital('fio2',v.fio2,'—');
  setVital('rr',v.rr,'—');
  setVital('temp',v.temp,'—');
  document.getElementById('vv-effort').textContent=v.effort||'—';
  // HR colour
  const hrEl=document.getElementById('v-hr');
  hrEl.classList.remove('ok','warn');
  if(v.hr&&v.hr>=100)hrEl.classList.add('ok');
  else if(v.hr&&v.hr>=60)hrEl.classList.add('warn');
}

function setVital(id,val,def){
  document.getElementById('vv-'+id).textContent=(val!=null)?val:def;
}

function buildVcRows(){
  if(!activeCase)return;
  const el=document.getElementById('vcRows');
  let html='';
  activeCase.vitals.forEach((v,i)=>{
    html+=`<div class="vc-row">
      <div class="vc-name" style="font-size:11px;">${v.label}</div>
      <div class="vc-btns">
        <div class="vc-btn ${i===vitalIdx?'active':''}" onclick="setVitalState(${i})" style="flex:none;width:auto;padding:7px 12px;">
          HR ${v.hr}${v.hr?' bpm':''} · SpO₂ ${v.spo2||'—'}${v.spo2?'%':''} · FiO₂ ${v.fio2||'—'}${v.fio2?'%':''}
        </div>
      </div>
    </div>`;
  });
  el.innerHTML=html;
}

function setVitalState(i){
  vitalIdx=i;
  renderVitals();
  buildVcRows();
}

function renderScenario(){
  if(!activeCase){
    document.getElementById('scenarioContent').innerHTML='<div class="no-case">Select a case above to begin</div>';
    return;
  }
  const c=activeCase;
  let html=`
    <div class="scenario-card open">
      <div class="sc-head" onclick="this.closest('.scenario-card').classList.toggle('open')">
        <span class="sc-icon">📝</span>
        <span class="sc-title">${c.tag} — ${c.name}</span>
        <span class="sc-chev">▼</span>
      </div>
      <div class="sc-body">${c.presentation}</div>
    </div>
  `;
  c.sections.forEach(s=>{
    html+=`<div class="scenario-card open">
      <div class="sc-head" onclick="this.closest('.scenario-card').classList.toggle('open')">
        <span class="sc-icon">${s.title.split(' ')[0]}</span>
        <span class="sc-title">${s.title.split(' ').slice(1).join(' ')}</span>
        <span class="sc-chev">▼</span>
      </div>
      <div class="sc-body">${s.body}</div>
    </div>`;
  });
  html+=`<div class="debrief-card">
    <div class="debrief-label">💬 Debrief Questions</div>
    ${c.debrief.map((q,i)=>`<div class="q-item"><div class="q-num">${i+1}</div><div>${q}</div></div>`).join('')}
  </div>`;
  document.getElementById('scenarioContent').innerHTML=html;
}

function simStart(){
  if(simRunning)return;
  simStart0=Date.now();
  simRunning=true;
  document.getElementById('simStartBtn').textContent='●';
  document.getElementById('simStartBtn').style.background='var(--text-dim)';
  simTimerInterval=setInterval(()=>{
    const e=Math.floor((Date.now()-simStart0)/1000);
    const m=Math.floor(e/60),s=e%60;
    document.getElementById('simTimer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },500);
}

function simReset(){
  clearInterval(simTimerInterval);
  simRunning=false;
  simStart0=null;
  document.getElementById('simTimer').textContent='00:00';
  document.getElementById('simStartBtn').textContent='▶';
  document.getElementById('simStartBtn').style.background='';
}

buildCaseGrid();
</script>
</body>
</html>
