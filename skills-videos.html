<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>Skills Videos · MyNeST</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --navy: #0a1628; --navy-mid: #122040; --navy-card: #1a2d50;
  --blue: #3b9eff; --blue-bright: #5db0ff; --teal: #00d4b4;
  --red: #ff4d6a; --amber: #ffb340; --green: #34d399;
  --text: #e8f0fe; --text-dim: #8da4c4; --border: #243860;
  --radius: 16px; --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--navy); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { overscroll-behavior: none; padding-bottom: calc(24px + var(--safe-bottom)); }

.header { background: var(--navy-mid); padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); }
.back-btn { background: var(--navy-card); border: 1px solid var(--border); color: var(--text-dim); padding: 6px 12px; border-radius: 20px; font-size: 14px; text-decoration: none; white-space: nowrap; }
.header h1 { font-size: 17px; font-weight: 700; }
.header .sub { font-size: 12px; color: var(--text-dim); }

.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }

.block-group { margin-bottom: 22px; }
.block-title { font-size: 12px; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 10px 4px; display: flex; align-items: center; gap: 8px; }
.block-title .count { background: var(--navy-card); border: 1px solid var(--border); color: var(--text-dim); border-radius: 10px; padding: 1px 8px; font-size: 10.5px; }

.video-card { background: var(--navy-card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.video-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, #0d1f3a, #14284a); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.video-thumb.has-video { background: #000; }
.video-thumb video { width: 100%; height: 100%; object-fit: contain; background: #000; }
.play-icon { width: 52px; height: 52px; border-radius: 50%; background: rgba(0,212,180,0.15); border: 2px solid var(--teal); display: flex; align-items: center; justify-content: center; }
.play-icon::after { content: ''; border-style: solid; border-width: 10px 0 10px 16px; border-color: transparent transparent transparent var(--teal); margin-left: 4px; }
.coming-soon-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(255,179,64,0.15); border: 1px solid var(--amber); color: var(--amber); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
.video-info { padding: 10px 14px 12px; }
.video-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.video-desc { font-size: 11.5px; color: var(--text-dim); }

.intro-note { background: var(--navy-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 18px; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn">← Home</a>
  <div>
    <h1>🎬 Skills Videos</h1>
    <div class="sub">MyNeST procedural skill demonstrations</div>
  </div>
</div>

<div class="wrap">
  <div class="intro-note">
    Short procedural demonstrations referenced throughout the MyNeST Workshop Guide. Tap a video to play. Videos marked "Coming soon" are still in production by the Video Production &amp; Simulation team.
  </div>
  <div id="videoGroups"></div>
</div>

<script>
// Each video: { title, desc, url }. Leave url empty until the file is hosted —
// the card will automatically switch from a "Coming soon" placeholder to a
// playable embedded video the moment a url is added here.
const VIDEO_GROUPS = [
  {
    block: 'Block A · Receiving the Baby & Initial Steps',
    videos: [
      { title: 'Delayed Cord Clamping — Vigorous Newborn', desc: 'DCC technique and observation for a vigorous baby at birth.', url: '' },
      { title: 'Immediate Cord Clamping — Non-Vigorous Newborn', desc: 'Clamp and transfer technique when DCC criteria are not met.', url: '' },
      { title: 'Initial Steps of Resuscitation (Single Personnel)', desc: 'Warm, dry, stimulate, position — performed by one provider.', url: '' },
      { title: 'Initial Steps of Resuscitation (With Assistant)', desc: 'The same sequence coordinated between two providers.', url: '' },
      { title: 'Suctioning Technique', desc: 'Correct depth, sequence (mouth before nose), and technique.', url: '' },
      { title: 'Post-Initial Steps Evaluation', desc: 'Assessing HR, breathing, and SpO₂ after initial steps.', url: '' },
    ],
  },
  {
    block: 'Block B · Positive Pressure Ventilation & Airway',
    videos: [
      { title: 'Initiating PPV', desc: 'T-piece setup, mask seal, and starting effective ventilation.', url: '' },
      { title: 'Intubation and Auscultation', desc: 'Laryngoscopy technique and confirming ETT placement.', url: '' },
    ],
  },
  {
    block: 'Block C · Chest Compressions',
    videos: [
      { title: 'CPR — Two-Thumb Encircling Technique', desc: 'The preferred technique: placement, depth, rate, and ratio.', url: '' },
      { title: 'CPR — Two-Finger Technique', desc: 'Alternative technique when two-thumb is not possible.', url: '' },
    ],
  },
  {
    block: 'Block D · Medications & UVC',
    videos: [
      { title: 'Preparing Adrenaline', desc: 'Diluting 1:1,000 to 1:10,000 and correct labelling.', url: '' },
      { title: 'IV Adrenaline Administration', desc: 'Dose, route, and flush via umbilical venous catheter.', url: '' },
    ],
  },
  {
    block: 'Block E · Preterm & Special Conditions',
    videos: [
      { title: 'Preterm Stabilisation', desc: 'Golden Hour thermoregulation, oxygen titration, and CPAP.', url: '' },
    ],
  },
];

function renderVideoGroups() {
  const root = document.getElementById('videoGroups');
  let html = '';
  VIDEO_GROUPS.forEach(group => {
    const total = group.videos.length;
    html += `<div class="block-group">
      <div class="block-title">${group.block} <span class="count">${total} video${total===1?'':'s'}</span></div>`;
    group.videos.forEach((v, i) => {
      const hasVideo = !!v.url;
      const safeUrl = v.url.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
      html += `<div class="video-card">
        <div class="video-thumb${hasVideo?' has-video':''}" onclick="playVideo(this, '${safeUrl}')">
          ${hasVideo
            ? `<video controls preload="none" poster=""><source src="${v.url}"></video>`
            : `<div class="play-icon"></div><div class="coming-soon-badge">Coming soon</div>`}
        </div>
        <div class="video-info">
          <div class="video-title">${v.title}</div>
          <div class="video-desc">${v.desc}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  root.innerHTML = html;
}

function playVideo(thumbEl, url) {
  if (!url) return; // no video hosted yet — placeholder is not clickable to "play"
  const video = thumbEl.querySelector('video');
  if (video) video.play();
}

renderVideoGroups();
</script>
</body>
</html>
