<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>ETT & UVC · MyNeST</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --navy:#0a1628;--navy-mid:#122040;--navy-card:#1a2d50;
  --blue:#3b9eff;--blue-bright:#5db0ff;--teal:#00d4b4;--red:#ff4d6a;--amber:#ffb340;--green:#34d399;
  --text:#e8f0fe;--text-dim:#8da4c4;--border:#243860;
  --radius:14px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--navy);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.topbar{display:flex;align-items:center;gap:12px;background:var(--navy-mid);border-bottom:1px solid var(--border);padding:48px 16px 14px;position:sticky;top:0;z-index:100;}
.back-btn{width:36px;height:36px;border-radius:10px;background:var(--navy-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--blue);font-size:18px;flex-shrink:0;}
.topbar-title{font-size:17px;font-weight:700;color:#fff;}
.topbar-sub{font-size:11px;color:var(--text-dim);}
.content{padding:16px;}

.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.input-card{
  background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;
}
.input-card.highlight{border-color:var(--teal);}
.input-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
.input-label.t{color:var(--teal);}
.num-input{
  width:100%;background:var(--navy-mid);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;font-size:22px;font-weight:800;color:#fff;outline:none;
  -moz-appearance:textfield;
}
.num-input::-webkit-inner-spin-button,.num-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.input-unit{font-size:11px;color:var(--text-dim);margin-top:4px;}

.preset-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px;}
.preset{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--navy-card);color:var(--text-dim);font-size:11.5px;font-weight:600;cursor:pointer;}

/* Results */
.section-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin:14px 0 8px;}

.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.result-card{
  background:var(--navy-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 12px;
}
.result-card.full{grid-column:1/-1;}
.result-card.primary{border-color:var(--teal);}
.result-icon{font-size:20px;margin-bottom:6px;}
.result-name{font-size:11px;color:var(--text-dim);margin-bottom:4px;}
.result-val{font-size:26px;font-weight:800;color:#fff;line-height:1;}
.result-unit{font-size:12px;color:var(--text-dim);margin-top:3px;}
.result-note{font-size:11px;color:var(--text-dim);line-height:1.5;margin-top:6px;}

.confirmation-box{
  background:var(--navy-mid);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;font-size:12.5px;line-height:1.7;margin-top:8px;
}
.confirmation-box strong{color:var(--text);}

.warn{
  background:rgba(255,179,64,.08);border:1px solid rgba(255,179,64,.25);border-radius:8px;
  padding:8px 10px;font-size:12px;color:var(--amber);line-height:1.5;margin-top:6px;
}

.ref-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;}
.ref-table th{color:var(--text-dim);font-size:11px;font-weight:700;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);}
.ref-table td{padding:7px 8px;border-bottom:1px solid rgba(36,56,96,.5);color:var(--text);}
.ref-table tr:last-child td{border-bottom:none;}
.ref-table tr.active-row td{background:rgba(59,158,255,.12);color:#fff;font-weight:700;}

.bottom-safe{height:calc(20px + var(--safe-bottom));}
.no-result{text-align:center;padding:30px 20px;color:var(--text-dim);font-size:14px;}
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="index.html">←</a>
  <div>
    <div class="topbar-title">ETT & UVC Calculator</div>
    <div class="topbar-sub">Tube size · Insertion depth · MyNeST</div>
  </div>
</div>

<div class="content">
  <div class="input-grid">
    <div class="input-card highlight">
      <div class="input-label t">Weight (kg)</div>
      <input class="num-input" type="number" id="wt" placeholder="0.0" min="0.3" max="6" step="0.1" oninput="calc()" inputmode="decimal">
      <div class="input-unit">kilograms</div>
    </div>
    <div class="input-card">
      <div class="input-label">Gestation (wk)</div>
      <input class="num-input" type="number" id="ga" placeholder="28" min="22" max="42" step="1" oninput="calc()" inputmode="numeric">
      <div class="input-unit">weeks</div>
    </div>
  </div>

  <div class="preset-row">
    <div class="preset" onclick="setVals(0.8,24)">24w 800g</div>
    <div class="preset" onclick="setVals(1.0,28)">28w 1kg</div>
    <div class="preset" onclick="setVals(1.5,31)">31w 1.5kg</div>
    <div class="preset" onclick="setVals(2.0,34)">34w 2kg</div>
    <div class="preset" onclick="setVals(2.5,36)">36w 2.5kg</div>
    <div class="preset" onclick="setVals(3.2,38)">38w 3.2kg</div>
    <div class="preset" onclick="setVals(3.5,40)">40w 3.5kg</div>
  </div>

  <div id="results">
    <div class="no-result">📏 Enter weight and gestation above</div>
  </div>
</div>
<div class="bottom-safe"></div>

<script>
function setVals(w,g){
  document.getElementById('wt').value=w;
  document.getElementById('ga').value=g;
  calc();
}

function calc(){
  const w=parseFloat(document.getElementById('wt').value);
  const ga=parseFloat(document.getElementById('ga').value);
  const el=document.getElementById('results');

  if(!w||w<=0){
    el.innerHTML='<div class="no-result">📏 Enter weight and gestation above</div>';
    return;
  }

  // ETT size
  let ettSize, ettNote='';
  if(w<1.0){ettSize='2.5';if(w<0.8)ettNote='Consider 2.0 mm for &lt;800g/&lt;26w';}
  else if(w<=2.0){ettSize='3.0';}
  else{ettSize='3.5';}

  // Suction catheter
  let sxSize='';
  if(w<1.0)sxSize='5F';
  else if(w<=2.0)sxSize='6F';
  else sxSize='6F or 8F';

  // ETT depth (NTL method = nasal-tragus length + 1 cm)
  // ETT oral insertion depth at lip:
  //   ≥1.0 kg: weight (kg) + 6 cm
  //   <1.0 kg: 6 − weight (kg)
  const roundHalf = n => Math.round(n * 2) / 2;
  const ettDepth_oral = w >= 1.0 ? roundHalf(w + 6).toFixed(1) : roundHalf(6 - (1 - w)).toFixed(1);
  const ettDepth_formula = w >= 1.0 ? 'Weight (kg) + 6 cm' : '6 − (1 − Weight (kg))';

  // UVC depth
  // High UVC: (gestation/10) – 1 cm for simplified, or weight-based
  // Resuscitation UVC: insert until free blood return (~3–5 cm from skin)
  // Formula: (0.5 × birthweight kg + 1) cm above bifurcation
  // Simplified low-position: 2–4 cm from skin
  const uvcLow = (w*1.5 + 2).toFixed(1); // approx low position

  // LMA
  let lmaSize='—', lmaNote='';
  if(ga&&ga>=34&&w>1.5){lmaSize='1';lmaNote='≥34w + >1.5kg';}
  else{lmaNote='Not indicated: &lt;34w or ≤1.5kg';}

  // OG tube
  let ogSize='';
  if(w<1.5)ogSize='5F';
  else ogSize='6F (may use 8F in term)';

  // Determine active ETT row
  const rows=[
    {label:'&lt;800g / &lt;26w',wt:'&lt;800g',ett:'2.0*',sx:'5F',ga:'&lt;26w'},
    {label:'&lt;1000g / &lt;28w',wt:'&lt;1000g',ett:'2.5',sx:'5F',ga:'&lt;28w'},
    {label:'1000–2000g / 28–34w',wt:'1–2kg',ett:'3.0',sx:'6F',ga:'28–34w'},
    {label:'&gt;2000g / &gt;34w',wt:'&gt;2kg',ett:'3.5',sx:'6 or 8F',ga:'&gt;34w'},
  ];
  let activeIdx=3;
  if(w<0.8)activeIdx=0;
  else if(w<1.0)activeIdx=1;
  else if(w<=2.0)activeIdx=2;

  el.innerHTML=`
    <div class="section-label">📏 Tube Sizes & Depths</div>
    <div class="result-grid">
      <div class="result-card primary">
        <div class="result-icon">🫁</div>
        <div class="result-name">ETT Inner Diameter</div>
        <div class="result-val">${ettSize}</div>
        <div class="result-unit">mm ID</div>
        ${ettNote?`<div class="result-note" style="color:var(--amber);">${ettNote}</div>`:''}
      </div>
      <div class="result-card primary">
        <div class="result-icon">📐</div>
        <div class="result-name">ETT Insertion Depth</div>
        <div class="result-val">${ettDepth_oral}</div>
        <div class="result-unit">cm at lip (oral)</div>
        <div class="result-note">${ettDepth_formula} · rounded to nearest 0.5 cm<br>Confirm with NTL + 1 cm</div>
      </div>
      <div class="result-card">
        <div class="result-icon">🩺</div>
        <div class="result-name">UVC Depth (low position)</div>
        <div class="result-val">~${uvcLow}</div>
        <div class="result-unit">cm from skin</div>
        <div class="result-note">Resuscitation: insert until free blood return (typically 3–5 cm)</div>
      </div>
      <div class="result-card">
        <div class="result-icon">🔬</div>
        <div class="result-name">Suction Catheter</div>
        <div class="result-val">${sxSize}</div>
        <div class="result-unit">French gauge</div>
      </div>
      <div class="result-card">
        <div class="result-icon">🫧</div>
        <div class="result-name">LMA Size</div>
        <div class="result-val">${lmaSize}</div>
        <div class="result-unit">${lmaNote}</div>
      </div>
      <div class="result-card">
        <div class="result-icon">🧪</div>
        <div class="result-name">OG Tube</div>
        <div class="result-val">${ogSize}</div>
        <div class="result-unit">Insert after 2 min PPV</div>
      </div>
    </div>

    <div class="section-label">ETT Confirmation — Required Methods</div>
    <div class="confirmation-box">
      <strong>1. Bilateral breath sounds</strong> — auscultate both axillae. Reduced left = right mainstem → withdraw 0.5 cm.<br>
      <strong>2. Silent epigastrium</strong> — louder than chest = oesophageal → remove immediately.<br>
      <strong>3. Misting</strong> — condensation visible in ETT with each breath.<br>
      <strong>4. Rising HR</strong> — most reliable clinical sign of correct placement.<br>
      <strong>5. CO₂ detector</strong> (if available) — purple → yellow = tracheal. No change with adequate cardiac output = suspect oesophageal.
    </div>

    <div class="section-label">Quick Reference Table</div>
    <table class="ref-table">
      <tr><th>Weight</th><th>GA</th><th>ETT (mm)</th><th>Suction</th></tr>
      ${rows.map((r,i)=>`<tr class="${i===activeIdx?'active-row':''}">
        <td>${r.wt}</td><td>${r.ga}</td><td>${r.ett}</td><td>${r.sx}</td>
      </tr>`).join('')}
    </table>
    <div class="result-note" style="margin-top:6px;font-size:11px;">* 2.0 mm optional for &lt;800g/&lt;26w. Highlighted row = calculated for ${w?w.toFixed(1):'—'} kg.</div>

    <div class="warn" style="margin-top:10px;">OG tube measurement: nasal bridge → earlobe → midway between xiphisternum and umbilicus. Leave on open drainage or aspirate 20 mL syringe.</div>
  `;
}
</script>
</body>
</html>
